name: Deploy Godot 3D to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit

      - name: Validate 3D assets
        run: godot --headless --script res://tests/validate_3d.gd

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html

      - name: Remove legacy browser caches
        run: |
          node tools/prepare_web_export.mjs build/web/index.html
          cp tools/disable_legacy_service_worker.js build/web/sw.js
          touch build/web/.nojekyll

      - name: Verify Godot-only artifact
        run: |
          test -f build/web/index.wasm
          test -f build/web/index.pck
          test -f build/web/sw.js
          ! grep -q "class=\"village\"" build/web/index.html
          grep -q "ashfall-build\" content=\"godot-soulslike" build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
